# Run the record and design contracts before merge.
#
# docs/DECISIONS.md is the owner's law, transcribed; docs/UIUX.md is the
# rendering authority. test/records.js guards the B<n> citation space and the
# Source-line requirement; test/tokens.js recomputes UIUX §2/§3 from the
# shipped index.html so the documents and the render cannot drift apart.
# Until now nothing ran these automatically — this runs them on every PR and
# on push to main, before a bad change can reach the deploy branch (B10).

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseding a PR push mid-run is fine to cancel — unlike a production
# deploy (B10), there is nothing here that needs to finish once started.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Browserless, stdlib only — no package.json (the repo ships index.html
      # and the docs; see B2: no stray files). No browser ever boots.
      - name: records.js — the DECISIONS.md citation space
        run: node test/records.js

      - name: tokens.js — UIUX §2/§3 recomputed from index.html
        run: node test/tokens.js
