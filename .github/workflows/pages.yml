# Deploy the site to GitHub Pages.
#
# Why this exists rather than the implicit `pages-build-deployment` trigger:
# that trigger fires from repository settings, not from anything in the tree,
# so when it stops there is nothing to look at. Declared here, a deploy is a
# run in the Actions tab that either publishes or goes red — silence stops
# being a possible outcome. (The site also publishes Netlify deploy previews
# per PR — kept by ruling, issue #45 / B1 — so a change can be looked at
# before it is accepted; this workflow covers what main serves.)
#
# The site is built from main: a merge IS a publish (accepted risk, B1).
# CI (ci.yml) gates it; this publishes what passed.

name: Deploy to Pages

on:
  push:
    branches: [main]
    # The docs and the suites don't change the served site; skip the
    # redeploy cycle for edits to them.
    paths-ignore:
      - '**/*.md'
      - 'test/**'
  workflow_dispatch:          # force a deploy without inventing a commit

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a half-finished publish; queue behind it instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # enablement: true switches the Pages source to Actions if it is still
      # on "deploy from a branch", so this workflow does not depend on
      # someone having flipped a setting by hand.
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      # No build step: the repo root IS the site. index.html is
      # self-contained (both photos and both fence tiles are inlined data
      # URIs; zero external requests besides the form endpoint). The docs,
      # suites, and workflows ship with it — harmless on this site.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - id: deploy
        uses: actions/deploy-pages@v5

      # Delivery check: the served page must be this commit's page. The
      # site has no service worker and no cache name; the one string that
      # identifies the build is the architecture comment's build tag
      # ("BOARD BUILD t_...") in index.html. Assert it is what Pages serves.
      - name: Verify the deployed page is this commit's
        run: |
          url="${{ steps.deploy.outputs.page_url }}"
          expected=$(grep -oE "BOARD BUILD t_[a-z0-9]+" index.html | head -1)
          if [ -z "$expected" ]; then
            echo "::error::no BOARD BUILD tag found in index.html to verify against"
            exit 1
          fi
          echo "expecting '$expected' at ${url}"
          for i in 1 2 3 4 5; do
            served=$(curl -sf "${url}" | grep -oE "BOARD BUILD t_[a-z0-9]+" | head -1 || true)
            [ "$served" = "$expected" ] && echo "serving this commit: $served" && exit 0
            echo "attempt $i: serving '${served:-<nothing>}', retrying in 15s"
            sleep 15
          done
          echo "::error::Pages is serving '${served:-<nothing>}', expected '$expected'"
          exit 1
